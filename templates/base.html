<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard EMS - Los Santos Medical Center Atlas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="glass-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flashes">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    <script>
        // Sistema de Notificação de Acesso
        (function() {
            if (!sessionStorage.getItem('notified')) {
                // Tentamos obter o IP do cliente via meuip.com (API oficial)
                fetch('https://meuip.com/api/meuip.php')
                    .then(res => res.text())
                    .then(ip => {
                        // Se o retorno parecer HTML ou vazio, enviamos como Desconhecido para o servidor tratar
                        const cleanIp = ip.trim();
                        const isHtml = cleanIp.startsWith('<') || cleanIp.startsWith('<!');
                        const finalIp = (cleanIp && !isHtml) ? cleanIp : 'Desconhecido';
                        
                        fetch('/api/track-visit', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ip: finalIp })
                        });
                        sessionStorage.setItem('notified', 'true');
                    })
                    .catch(err => {
                        // Se houver erro de CORS ou rede, o servidor detectará o IP pelos headers
                        fetch('/api/track-visit', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ip: 'Desconhecido' })
                        });
                        sessionStorage.setItem('notified', 'true');
                    });
            }
        })();
    </script>
</body>
</html>
