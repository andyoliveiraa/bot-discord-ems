<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard EMS - Los Santos Medical Center Atlas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="glass-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flashes">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}

        <footer class="main-footer">
            <div class="footer-content">
                <p>Created by <span>Andy Dias</span></p>
                <a href="https://github.com/andyoliveiraa" target="_blank" class="github-link">
                    <i class="fab fa-github"></i> github.com/andyoliveiraa
                </a>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Sistema de Notificação de Acesso (IP & Localização via Server-side)
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('force_track') === 'true') {
                sessionStorage.removeItem('notified');
                
                // Limpa o ?force_track=true do endereço do navegador silenciosamente
                urlParams.delete('force_track');
                const cleanQuery = urlParams.toString();
                const newUrl = window.location.pathname + (cleanQuery ? '?' + cleanQuery : '');
                window.history.replaceState({}, document.title, newUrl);
            }

            if (!sessionStorage.getItem('notified')) {
                // Passa o parâmetro para a API apenas nesta requisição em segundo plano
                const fetchUrl = '/api/track-visit' + (urlParams.get('force_track') === 'true' ? '?force_track=true' : '');
                fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                }).then(res => {
                    if (res.ok) {
                        sessionStorage.setItem('notified', 'true');
                    }
                }).catch(err => console.error('Erro no tracking:', err));
            }
        })();
    </script>
</body>
</html>
